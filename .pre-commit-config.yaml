#
# .pre-commit-config.yaml: Repository secret, file, YAML, workflow, shell, and
#                          Compose environment validation hooks.
#

repos:
  #
  # Scan changed content for hardcoded secrets before it can be committed.
  #
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  #
  # Compare detected secrets against the reviewed repository baseline.
  #
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]

  #
  # Run general file hygiene, syntax, shebang, and whitespace checks.
  #
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]

  #
  # Enforce strict YAML style across repository configuration files.
  #
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args:
          - "--strict"
          - "-d"
          - "{extends: default, rules: {document-start: disable, line-length: disable, truthy: disable}}"

  #
  # Validate GitHub Actions expressions, permissions, and shell fragments.
  #
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  #
  # Check project-owned shell scripts for correctness and portability issues.
  #
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  #
  # Enforce Compose interpolation and example environment parity.
  #
  - repo: local
    hooks:
      - id: check-compose-env
        name: check Compose and example environment parity
        entry: test/check-compose-env.sh
        language: script
        pass_filenames: false
