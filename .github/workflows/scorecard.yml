# scorecard.yml: Measure and publish repository supply-chain security posture.
#

name: "Inspect the Archive Locks 🔐"

on:
  branch_protection_rule:
  schedule:
    - cron: "41 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scorecard:
    name: "Grade the Filing Fortress 🛡️"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      security-events: write

    steps:
      - name: "Retrieve the Archive Map 🗺️"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: "Test Every Lock And Hinge 🔭"
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true

      - name: "File the Security Report 📜"
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3  # v4
        with:
          sarif_file: scorecard-results.sarif
