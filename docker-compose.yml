# docker-compose.yml: Single-file Paperless-ngx deployment for Docker Compose,
#                     Synology Container Manager, and Portainer.
#

#
# Shared defaults for long-running services.
#
x-default-container: &default-container
  pull_policy: always
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: ${LOG_MAX_SIZE}
      max-file: ${LOG_MAX_FILE}

services:
  #
  # Redis-compatible message broker used by Paperless background workers.
  #
  redis:
    <<: *default-container
    image: docker.io/library/redis:${REDIS_TAG}
    user: ${DEFAULT_UID}:${DEFAULT_GID}
    read_only: true
    sysctls:
      - net.core.somaxconn=512
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: ${REDIS_HEALTHCHECK_TIMEOUT}
      interval: ${REDIS_HEALTHCHECK_INTERVAL}
      retries: ${REDIS_HEALTHCHECK_RETRIES}
    environment:
      TZ: ${TZ}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - ${REDIS_CONFIG_PATH}:/data:rw

  #
  # PostgreSQL database for Paperless metadata and application state.
  # The container data target differs between PostgreSQL 17 and 18+.
  #
  postgres:
    <<: *default-container
    image: docker.io/library/postgres:${POSTGRES_TAG}
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "${POSTGRES_DB}", "-U", "${POSTGRES_USER}"]
      timeout: ${POSTGRES_HEALTHCHECK_TIMEOUT}
      interval: ${POSTGRES_HEALTHCHECK_INTERVAL}
      retries: ${POSTGRES_HEALTHCHECK_RETRIES}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${POSTGRES_CONFIG_PATH}:${POSTGRES_DATA_TARGET}:rw

  #
  # Gotenberg converts Office and email content into PDFs for Paperless.
  #
  gotenberg:
    <<: *default-container
    image: docker.io/gotenberg/gotenberg:${GOTENBERG_TAG}
    command:
      - gotenberg
      - --chromium-disable-javascript=true
      - --chromium-allow-list=file:///tmp/.*

  #
  # Apache Tika extracts text and metadata from Office documents.
  #
  tika:
    <<: *default-container
    image: docker.io/apache/tika:${TIKA_TAG}

  #
  # Paperless-ngx application, consumer, scheduler, and task workers.
  #
  paperless-ngx:
    <<: *default-container
    image: ghcr.io/paperless-ngx/paperless-ngx:${PAPERLESS_TAG}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "2", "http://localhost:8000"]
      timeout: ${PAPERLESS_HEALTHCHECK_TIMEOUT}
      interval: ${PAPERLESS_HEALTHCHECK_INTERVAL}
      start_period: ${PAPERLESS_HEALTHCHECK_START_PERIOD}
      retries: ${PAPERLESS_HEALTHCHECK_RETRIES}
    environment:
      # Broker and database connectivity.
      PAPERLESS_REDIS: ${PAPERLESS_REDIS}
      PAPERLESS_DBENGINE: ${PAPERLESS_DBENGINE}
      PAPERLESS_DBHOST: ${PAPERLESS_DBHOST}
      PAPERLESS_DBNAME: ${POSTGRES_DB}
      PAPERLESS_DBUSER: ${POSTGRES_USER}
      PAPERLESS_DBPASS: ${POSTGRES_PASSWORD}

      # Runtime identity, URL, and required signing secret.
      USERMAP_UID: ${DEFAULT_UID}
      USERMAP_GID: ${DEFAULT_GID}
      PAPERLESS_TIME_ZONE: ${TZ}
      PAPERLESS_URL: ${PAPERLESS_URL}
      PAPERLESS_CSRF_TRUSTED_ORIGINS: ${PAPERLESS_CSRF_TRUSTED_ORIGINS}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY}

      # Initial administrator and document-processing behavior.
      PAPERLESS_ADMIN_USER: ${PAPERLESS_ADMIN_USER}
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD}
      PAPERLESS_EMPTY_TRASH_DIR: ${PAPERLESS_EMPTY_TRASH_DIR}
      PAPERLESS_CONSUMER_DELETE_DUPLICATES: ${PAPERLESS_CONSUMER_DELETE_DUPLICATES}
      PAPERLESS_FILENAME_FORMAT: '{{ created_year }}/{{ correspondent }}/{{ document_type }}/{{ title }}'
      PAPERLESS_OCR_LANGUAGE: ${PAPERLESS_OCR_LANGUAGE}
      PAPERLESS_OCR_ROTATE_PAGES_THRESHOLD: ${PAPERLESS_OCR_ROTATE_PAGES_THRESHOLD}
      PAPERLESS_TASK_WORKERS: ${PAPERLESS_TASK_WORKERS}

      # Office document parsing and conversion.
      PAPERLESS_TIKA_ENABLED: ${PAPERLESS_TIKA_ENABLED}
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: ${PAPERLESS_TIKA_GOTENBERG_ENDPOINT}
      PAPERLESS_TIKA_ENDPOINT: ${PAPERLESS_TIKA_ENDPOINT}
    ports:
      - "${PAPERLESS_WEBUI_PORT}:8000"
    volumes:
      - ${PAPERLESS_DATA_PATH}:/usr/src/paperless/data:rw
      - ${PAPERLESS_MEDIA_PATH}:/usr/src/paperless/media:rw
      - ${PAPERLESS_EXPORT_PATH}:/usr/src/paperless/export:rw
      - ${PAPERLESS_CONSUME_PATH}:/usr/src/paperless/consume:rw
      - ${PAPERLESS_TRASH_PATH}:/usr/src/paperless/trash:rw
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      tika:
        condition: service_started
      gotenberg:
        condition: service_started

  #
  # Optional Paperless-AI companion service.
  #
  paperless-ai:
    <<: *default-container
    image: docker.io/clusterzx/paperless-ai:${PAPERLESS_AI_TAG}
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "timeout 10s bash -c ':> /dev/tcp/127.0.0.1/3000' || exit 1"]
      timeout: ${PAPERLESS_AI_HEALTHCHECK_TIMEOUT}
      interval: ${PAPERLESS_AI_HEALTHCHECK_INTERVAL}
      start_period: ${PAPERLESS_AI_HEALTHCHECK_START_PERIOD}
      retries: ${PAPERLESS_AI_HEALTHCHECK_RETRIES}
    environment:
      PUID: ${DEFAULT_UID}
      PGID: ${DEFAULT_GID}
    ports:
      - "${PAPERLESS_AI_WEBUI_PORT}:3000"
    volumes:
      - ${PAPERLESS_AI_CONFIG_PATH}:/app/data:rw
    depends_on:
      paperless-ngx:
        condition: service_healthy

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME}
    ipam:
      driver: default
      config:
        - subnet: ${COMPOSE_NETWORK_SUBNET}
          ip_range: ${COMPOSE_NETWORK_IP_RANGE}
          gateway: ${COMPOSE_NETWORK_GATEWAY}
