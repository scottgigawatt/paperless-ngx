#
# scorecard.yml: Measure and publish repository supply-chain security posture.
#

name: "Inspect the Archive Locks 🔐"

#
# Re-evaluate branch protection, security workflow changes, the weekly schedule,
# and explicit maintainer requests against the current default branch.
#
on:
    branch_protection_rule:
    push:
        branches:
            - main
        paths:
            - ".github/workflows/**"
            - ".github/renovate.json5"
    schedule:
        - cron: "41 8 * * 1"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    #
    # Score repository practices and upload signed SARIF findings to GitHub code
    # scanning with only the identity and security permissions required.
    #
    scorecard:
        name: "Grade the Filing Fortress 🛡️"
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            actions: read
            contents: read
            id-token: write
            security-events: write

        steps:
            #
            # Keep credentials out of the checkout before the third-party
            # Scorecard action examines repository history and configuration.
            #
            - name: "Retrieve the Archive Map 🗺️"
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
              with:
                  persist-credentials: false

            #
            # Produce SARIF for local workflow use and publish the aggregate
            # Scorecard result through OpenSSF's supported reporting channel.
            #
            - name: "Test Every Lock And Hinge 🔭"
              uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
              with:
                  results_file: scorecard-results.sarif
                  results_format: sarif
                  publish_results: true

            #
            # Upload the generated report so repository-level findings appear
            # beside the project's other GitHub code-scanning alerts.
            #
            - name: "File the Security Report 📜"
              uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28  # v4
              with:
                  sarif_file: scorecard-results.sarif
